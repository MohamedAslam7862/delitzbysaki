<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="Deliz brownies, cookies and gift boxes baked fresh to order.">
<meta property="og:title" content="Deliz — Fresh Brownies & Cookies">
<meta property="og:description" content="Small-batch brownies, cookies and gift boxes baked fresh to order.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<title>Deliz — Fresh Brownies & Cookies</title>

<link rel="icon" href="assets/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="media-queries.css">
<link rel="stylesheet" href="bakery-theme.css">
<link rel="stylesheet" href="bakery-polish.css">
</head>

<body>

<!-- SITE: HEADER -->
<header class="site-header">

    <div class="header-inner">

        <a class="brand" href="#home" aria-label="Deliz home">
            <img src="assets/deliz-logo.png" alt="Deliz by Saki logo">

            <span class="brand-copy">
                <strong>DELIZ</strong>
                <small>by saki</small>
            </span>
        </a>

        <nav class="desktop-nav" aria-label="Primary navigation">
            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#specials">Specials</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>

        <a class="cart-link" href="#cart" aria-label="Shopping cart">

            <svg class="cart-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true"
                 focusable="false">

                <path d="M3.5 5.5h1.7l1.8 9.6c.1.6.6 1 1.2 1h8.4c.6 0 1.1-.4 1.2-1l1.2-7.1H6.1"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

                <circle cx="9.2" cy="18.1" r="1.2" fill="currentColor"/>
                <circle cx="16.2" cy="18.1" r="1.2" fill="currentColor"/>

            </svg>

            <span>Cart</span>
            <b id="cart-count">1</b>

        </a>

    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
        <a href="#shop">Shop</a>
        <a href="#specials">Specials</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

</header>

<main id="app" tabindex="-1"></main>

<!-- SITE: FOOTER -->
<footer class="site-footer">

    <div class="footer-grid">

        <div class="footer-brand">

            <img src="assets/deliz-logo.png" alt="Deliz by Saki logo">

            <span class="brand-copy">
                <strong>DELIZ</strong>
                <small>by saki</small>
            </span>

        </div>

        <div>

            <h3>Explore</h3>

            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#specials">Specials</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>

        </div>

        <div>

            <h3>Say hello</h3>

            <a href="https://www.instagram.com/deliz_saki/"
               target="_blank"
               rel="noreferrer">
                Instagram · @deliz_saki
            </a>

            <p>
                Fresh orders need 48 hours.
                Festive boxes need 10 days.
            </p>

        </div>

    </div>

    <p class="copyright">
        © <span id="year"></span> Deliz by saki. Baked with love.
    </p>

</footer>

<div id="lightbox"
     class="lightbox"
     hidden
     role="dialog"
     aria-modal="true">

    <button class="lightbox-close" aria-label="Close">×</button>

    <button class="lightbox-prev" aria-label="Previous photo">‹</button>

    <figure>
        <img id="lightbox-image" alt="">
        <figcaption id="lightbox-count"></figcaption>
    </figure>

    <button class="lightbox-next" aria-label="Next photo">›</button>

</div>

<div id="toast"
     class="toast"
     role="status"
     aria-live="polite">
</div>

<script src="script.js"></script>

</body>
</html>
